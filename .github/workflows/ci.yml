name: AtelierFlow CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ITProjects

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./ITProjects/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Tests (Node.js native test runner)
        run: node --test tests/smoke.test.mjs

      - name: Verify Monte Carlo Simulation Script (Python)
        working-directory: .
        run: python3 scripts/monte_carlo.py

      - name: Build Next.js Application
        run: npm run build

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './ITProjects'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-artifact
          path: ./ITProjects/.next/
          retention-days: 7
