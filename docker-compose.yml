services:
  atelierflow-web:
    build:
      context: .
      dockerfile: DockerFile
    container_name: atelierflow-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Open Source SLA Monitoring (ЛЗ 11 — NFR-03: 99.5% Availability)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: atelierflow-uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    depends_on:
      - atelierflow-web

volumes:
  uptime_kuma_data:
